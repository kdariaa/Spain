<p name="formulation">Дано число X. Определить, принадлежит ли это число заданному промежутку [a, b].</p>

<ul>
<li>Формулировка задачи
<br><textarea cols="60" rows="4" id="task" name="formulation">Дана температура воздуха X в Мадриде. Туристу комфортно гулять по городу, когда температура принадлежит промежутку [a, b]. Определить, комфортна ли такая температура для прогулки.</textarea></li>
<li>X: <input id="x" name="x" type="number" step="any" value="25"></li>
<li>a: <input id="a" name="a" type="number" step="any" value="20"></li>
<li>b: <input id="b" name="b" type="number" step="any" value="30"></li>
<li>Результат: <input id="result" name="result" value="не определен" size="60"></li>
<li><input id="calc" type="button" value="Посчитать"></li>
</ul>
